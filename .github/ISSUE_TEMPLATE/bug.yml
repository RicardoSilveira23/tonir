name: Bug
description: Something Tonir does wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Tonir version
      description: /plugin shows it
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      placeholder: 2.1.330
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: screenshot
    attributes:
      label: A screenshot of the pane
      description: Crop it to the pane, and check it shows no folder names or issues you'd rather keep private.
